services:
  # SakshyaChain Express REST API Backend
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sakshyachain-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - STRICT_CORS_ENABLED=true
      - ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:80,http://localhost:5000,http://192.168.1.14:5173
      - ALLOWED_CLIENT_IPS=127.0.0.1,::1,172.,192.168.,*
      - JWT_SECRET=sakshya_chain_jwt_access_secret_2026_super_secure_9921
      - JWT_REFRESH_SECRET=sakshya_chain_jwt_refresh_secret_2026_super_secure_8812
    volumes:
      - sakshyachain-data:/app/data
    networks:
      - sakshyachain-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  # SakshyaChain Nginx React Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sakshyachain-client
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - sakshyachain-net

volumes:
  sakshyachain-data:
    driver: local

networks:
  sakshyachain-net:
    driver: bridge
